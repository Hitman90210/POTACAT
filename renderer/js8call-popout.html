<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="popout-theme-boot.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>JS8Call</title>
  <script src="popout-theme-bootstrap.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Only var() names that exist in styles.css for BOTH themes — the mercury
       popout's header comment explains why (undefined names silently fall back
       to a dark hex and the window ignores light mode). */
    body { background: var(--bg-primary, #1a1a2e); color: var(--text-primary, #e0e0e0);
           margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .jc-titlebar { -webkit-app-region: drag; user-select: none; display: flex; align-items: center;
      justify-content: space-between; padding: 6px 10px; background: var(--bg-secondary, #16213e);
      border-bottom: 1px solid var(--border-primary, #333); font-size: 12px; font-weight: 600;
      color: var(--text-primary, #e0e0e0); flex-shrink: 0; }
    .jc-titlebar .jc-controls { -webkit-app-region: no-drag; display: flex; gap: 4px; }
    .jc-titlebar button { background: none; border: 1px solid var(--border-primary, #333);
      color: var(--text-secondary, #888); width: 22px; height: 22px; cursor: pointer;
      font-size: 13px; line-height: 1; border-radius: 3px; }
    .jc-titlebar button:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* Status strip: connection, station identity, TX. */
    .jc-bar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; font-size: 11px;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border-primary);
      color: var(--text-dim, #888); flex-shrink: 0; flex-wrap: wrap; }
    .jc-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex-shrink: 0; }
    .jc-dot.up { background: var(--accent-green-btn, #4ecca3); }
    .jc-dot.down { background: var(--accent-red, #e94560); }
    .jc-call { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    /* TX indicator. JS8Call keys on its own schedule (heartbeat auto-reply is a
       feature of the mode), so this is the operator's only visible warning that
       the radio is live and POTACAT has stood down. */
    .jc-tx { margin-left: auto; padding: 2px 8px; border-radius: 3px; font-weight: 600;
      border: 1px solid var(--border-primary); color: var(--text-dim); }
    .jc-tx.on { background: var(--accent-red, #e94560); color: #fff; border-color: var(--accent-red, #e94560);
      animation: jc-pulse 1s ease-in-out infinite; }
    @keyframes jc-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }

    /* Setup problems — the whole point of the config reader. */
    #jc-problems { flex-shrink: 0; }
    .jc-prob { padding: 7px 10px; font-size: 12px; border-bottom: 1px solid var(--border-primary);
      background: var(--bg-tertiary, #1a1a2e); }
    .jc-prob b { display: block; color: var(--text-primary); font-weight: 600; margin-bottom: 2px; }
    .jc-prob span { color: var(--text-secondary); }
    .jc-prob.blocker { border-left: 3px solid var(--accent-red, #e94560); }
    .jc-prob.conflict { border-left: 3px solid var(--source-sota, #f0a500); }
    .jc-prob.notice { border-left: 3px solid var(--accent-blue, #4fc3f7); }
    .jc-prob.warn { border-left: 3px solid var(--border-primary); }

    .jc-tabs { display: flex; gap: 2px; padding: 4px 8px 0; background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary); flex-shrink: 0; }
    .jc-tab { background: none; border: 1px solid transparent; border-bottom: none; color: var(--text-dim);
      padding: 4px 12px; font-size: 12px; cursor: pointer; border-radius: 4px 4px 0 0; }
    .jc-tab.active { background: var(--bg-primary); border-color: var(--border-primary);
      color: var(--text-primary); font-weight: 600; }

    .jc-pane { flex: 1; overflow-y: auto; padding: 4px 0; display: none; }
    .jc-pane.active { display: block; }

    .jc-row { display: flex; gap: 8px; padding: 3px 10px; font-family: monospace; font-size: 12px;
      border-bottom: 1px solid var(--border-secondary, #1f1f2e); align-items: baseline; }
    .jc-row .jc-t { color: var(--text-tertiary, #666); flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .jc-row .jc-s { color: var(--accent-blue); flex-shrink: 0; width: 34px; text-align: right;
      font-variant-numeric: tabular-nums; }
    .jc-row .jc-m { flex: 1; color: var(--text-primary); word-break: break-word; }
    /* Addressed to you: the reason to have this window open at all. */
    .jc-row.to-me { background: rgba(78, 204, 163, 0.10); }
    .jc-row.to-me .jc-m { color: var(--accent-green-btn, #4ecca3); font-weight: 600; }
    .jc-row.replay { opacity: 0.72; }

    .jc-empty { padding: 22px 14px; text-align: center; color: var(--text-secondary); font-size: 12px; line-height: 1.6; }
    .jc-empty code { background: var(--bg-tertiary); padding: 1px 5px; border-radius: 3px; }
    .jc-link { color: var(--accent-blue, #4fc3f7); cursor: pointer; text-decoration: underline; }
    .jc-btn { background: var(--bg-input, #0f1419); border: 1px solid var(--border-primary);
      color: var(--text-primary); border-radius: 3px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
    .jc-btn:hover { background: var(--bg-hover); }
    .jc-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Transmit row */
    .jc-tx-row { display: flex; gap: 6px; align-items: center; padding: 7px 10px; flex-shrink: 0;
      background: var(--bg-secondary); border-top: 1px solid var(--border-primary); }
    .jc-tx-row input { flex: 1; min-width: 0; padding: 4px 7px; font-size: 12px;
      background: var(--bg-input, #0f1419); border: 1px solid var(--border-primary);
      color: var(--text-primary); border-radius: 3px; }
    .jc-hb { font-weight: 600; }
    #jc-tx-note { padding: 0 10px 7px; font-size: 11px; color: var(--text-secondary);
      background: var(--bg-secondary); flex-shrink: 0; min-height: 0; line-height: 1.5; }
    #jc-tx-note.err { color: var(--accent-red, #e94560); }
    #jc-tx-note.ok { color: var(--accent-green-btn, #4ecca3); }
    /* The composed heartbeat, shown before it is sent. */
    #jc-tx-note code { background: var(--bg-tertiary, #1a1a2e); padding: 1px 5px; border-radius: 3px;
      font-family: monospace; color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="jc-titlebar">
    <span>JS8Call</span>
    <div class="jc-controls">
      <button id="jc-min" title="Minimize">&minus;</button>
      <button id="jc-close" title="Close">&times;</button>
    </div>
  </div>

  <div class="jc-bar">
    <span class="jc-dot" id="jc-dot"></span>
    <span id="jc-state">Connecting…</span>
    <span class="jc-call" id="jc-station"></span>
    <button class="jc-btn" id="jc-retry" title="Re-read JS8Call's settings and reconnect">Retry</button>
    <span class="jc-tx" id="jc-tx">RX</span>
  </div>

  <div id="jc-problems"></div>

  <div class="jc-tabs">
    <button class="jc-tab active" data-pane="all">Activity</button>
    <button class="jc-tab" data-pane="mine">For me</button>
  </div>

  <div class="jc-pane active" id="jc-pane-all">
    <div class="jc-empty" id="jc-empty">
      Waiting for JS8Call…<br><br>
      POTACAT reads a JS8Call you run yourself. It needs
      <code>Enable TCP Server API</code> ticked under
      <code>File &gt; Settings &gt; Reporting &gt; API</code>.
    </div>
  </div>
  <div class="jc-pane" id="jc-pane-mine"></div>

  <!-- Transmit. Deliberately shows the exact text that will go on the air
       before it does — a transmit button that hides its payload is how people
       put the wrong thing out. Operator-initiated only; there is no automatic
       path from POTACAT. -->
  <div class="jc-tx-row" id="jc-tx-row">
    <button class="jc-btn jc-hb" id="jc-hb" title="Send your heartbeat to the @HB group">Heartbeat</button>
    <input type="text" id="jc-text" placeholder="Message to send via JS8Call" maxlength="200" autocomplete="off" spellcheck="false">
    <button class="jc-btn" id="jc-send">Send</button>
  </div>
  <div id="jc-tx-note"></div>

  <script src="js8call-popout.js"></script>
</body>
</html>
