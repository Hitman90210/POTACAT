<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="popout-theme-boot.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>JS8Call</title>
  <script src="popout-theme-bootstrap.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Only var() names defined in styles.css for BOTH themes. The log-popout
       header documents why: undefined names fall back to a dark hex and the
       window silently ignores light mode. */
    body { background: var(--bg-primary, #1a1a2e); color: var(--text-primary, #e0e0e0);
           margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .num { font-variant-numeric: tabular-nums; }

    /* --- title + status ---------------------------------------------------- */
    .jc-titlebar { -webkit-app-region: drag; user-select: none; display: flex; align-items: center;
      justify-content: space-between; padding: 6px 10px; background: var(--bg-secondary, #16213e);
      border-bottom: 1px solid var(--border-primary, #333); font-size: 12px; font-weight: 600;
      color: var(--text-primary, #e0e0e0); flex-shrink: 0; }
    .jc-controls { -webkit-app-region: no-drag; display: flex; gap: 4px; }
    .jc-titlebar button { background: none; border: 1px solid var(--border-primary, #333);
      color: var(--text-secondary, #888); width: 22px; height: 22px; cursor: pointer;
      font-size: 13px; line-height: 1; border-radius: 3px; }
    .jc-titlebar button:hover { background: var(--bg-hover); color: var(--text-primary); }

    .jc-bar { display: flex; align-items: center; gap: 9px; padding: 5px 10px; font-size: 11px;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border-primary);
      color: var(--text-secondary, #888); flex-shrink: 0; flex-wrap: wrap; }
    .jc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-tertiary, #666); flex: none; }
    .jc-dot.up { background: var(--accent-green-btn, #4ecca3); }
    .jc-dot.down { background: var(--accent-red, #e94560); }
    .jc-bar b { color: var(--text-primary); font-weight: 600; }
    /* TX is the operator's only warning that JS8Call has taken the radio. */
    .jc-tx { margin-left: auto; padding: 2px 8px; border-radius: 3px; font-weight: 700;
      border: 1px solid var(--border-primary); color: var(--text-tertiary, #666); flex: none; }
    .jc-tx.on { background: var(--accent-red, #e94560); color: #fff; border-color: var(--accent-red, #e94560);
      animation: jc-pulse 1s ease-in-out infinite; }
    @keyframes jc-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
    @media (prefers-reduced-motion: reduce) { .jc-tx.on { animation: none; } }

    #jc-problems { flex-shrink: 0; max-height: 30vh; overflow-y: auto; }
    .jc-prob { padding: 7px 10px; font-size: 12px; border-bottom: 1px solid var(--border-primary);
      background: var(--bg-tertiary, #1a1a2e); }
    .jc-prob b { display: block; color: var(--text-primary); font-weight: 600; margin-bottom: 2px; }
    .jc-prob span { color: var(--text-secondary); }
    .jc-prob.blocker { border-left: 3px solid var(--accent-red, #e94560); }
    .jc-prob.conflict { border-left: 3px solid var(--source-sota, #f0a500); }
    .jc-prob.notice { border-left: 3px solid var(--accent-blue, #4fc3f7); }
    .jc-prob.warn { border-left: 3px solid var(--border-primary); }

    /* --- three columns ----------------------------------------------------- */
    .jc-cols { flex: 1; display: grid; grid-template-columns: 190px minmax(0, 1fr) 176px; min-height: 0; }
    .jc-rail { background: var(--bg-secondary); overflow-y: auto; min-height: 0; }
    .jc-rail-l { border-right: 1px solid var(--border-secondary, #1f1f2e); }
    .jc-rail-r { border-left: 1px solid var(--border-secondary, #1f1f2e); }
    .jc-railhead { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-tertiary, #666); padding: 8px 10px 5px; font-weight: 600;
      display: flex; align-items: baseline; gap: 6px; }
    .jc-railhead button { margin-left: auto; background: none; border: none; padding: 0;
      color: var(--accent-blue, #4fc3f7); font-size: 10px; cursor: pointer; }
    /* Narrow window: the rails are supporting information, the thread is the app. */
    @media (max-width: 720px) { .jc-cols { grid-template-columns: 150px minmax(0, 1fr); } .jc-rail-r { display: none; } }
    @media (max-width: 520px) { .jc-cols { grid-template-columns: minmax(0, 1fr); } .jc-rail-l { display: none; } }

    /* conversation rows */
    .jc-conv { display: flex; gap: 7px; align-items: baseline; padding: 7px 10px; width: 100%;
      background: none; border: none; border-left: 2px solid transparent; text-align: left;
      color: inherit; font: inherit; cursor: pointer; }
    .jc-conv + .jc-conv { border-top: 1px solid var(--border-secondary, #1f1f2e); }
    .jc-conv:hover { background: var(--bg-hover); }
    .jc-conv:focus-visible { outline: 2px solid var(--accent-blue, #4fc3f7); outline-offset: -2px; }
    .jc-conv.sel { background: var(--bg-tertiary, #1a1a2e); border-left-color: var(--accent-blue, #4fc3f7); }
    .jc-conv .c { font-weight: 600; font-size: 12.5px; color: var(--text-primary);
      font-family: ui-monospace, monospace; flex: none; }
    .jc-conv.unread .c { color: var(--accent-green-btn, #4ecca3); }
    .jc-conv.group .c { color: var(--text-secondary); font-weight: 500; }
    .jc-conv .p { font-size: 10.5px; color: var(--text-tertiary, #666); flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .jc-conv .w { font-size: 10px; color: var(--text-tertiary, #666); flex: none; }
    /* Filled green stays the non-themed mint so black on it passes contrast in
       BOTH themes — the Save QSO lesson. --accent-green (themed) goes dark
       forest in light mode and would make this unreadable. */
    .jc-badge { background: var(--accent-green-btn, #4ecca3); color: #000; border-radius: 9px;
      padding: 0 6px; font-size: 10px; font-weight: 700; flex: none; line-height: 16px;
      min-width: 17px; text-align: center; }

    /* --- thread ------------------------------------------------------------ */
    .jc-thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .jc-threadhead { display: flex; align-items: baseline; gap: 8px; padding: 8px 12px; flex-shrink: 0;
      border-bottom: 1px solid var(--border-secondary, #1f1f2e); font-size: 11px; color: var(--text-secondary); }
    .jc-threadhead b { font-size: 13px; color: var(--text-primary); font-family: ui-monospace, monospace; }
    .jc-msgs { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column;
      gap: 9px; min-height: 0; }
    .jc-msg { max-width: 84%; }
    .jc-msg .m { font-size: 10px; color: var(--text-tertiary, #666); margin-bottom: 2px; }
    .jc-msg .b { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--border-secondary, #1f1f2e);
      background: var(--bg-tertiary, #1a1a2e); color: var(--text-primary); word-break: break-word; }
    .jc-msg.out { align-self: flex-end; }
    .jc-msg.out .m { text-align: right; }
    .jc-msg.out .b { background: var(--bg-hover); border-color: var(--accent-blue, #4fc3f7); }
    .jc-fold { align-self: center; font-size: 10.5px; color: var(--text-tertiary, #666);
      border: 1px dashed var(--border-primary); border-radius: 20px; padding: 2px 11px; }
    .jc-empty { padding: 24px 16px; text-align: center; color: var(--text-secondary);
      font-size: 12px; line-height: 1.65; }
    .jc-empty code { background: var(--bg-tertiary); padding: 1px 5px; border-radius: 3px; }

    /* setup panel */
    /* Takes the transcript's place, so it owns the same slot in the column. */
    .jc-setup { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px;
      max-width: 60ch; width: 100%; margin: 0 auto; }
    .jc-setup[hidden] { display: none; }
    .jc-setup h2 { font-size: 15px; margin: 0 0 6px; color: var(--text-primary); font-weight: 600; }
    .jc-setup p { margin: 0 0 12px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
    .jc-setup ul { margin: 0 0 14px; padding: 0; list-style: none; font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .jc-setup li { padding: 4px 0 4px 16px; position: relative; color: var(--text-primary);
      border-bottom: 1px solid var(--border-secondary, #1f1f2e); }
    .jc-setup li::before { content: '→'; position: absolute; left: 0; color: var(--accent-blue, #4fc3f7); }
    .jc-setup-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .jc-setup-actions label { font-size: 11.5px; color: var(--text-secondary); display: flex;
      align-items: center; gap: 5px; cursor: pointer; }
    .jc-setup-manual { margin-top: 14px; font-size: 11.5px; line-height: 1.7;
      border-top: 1px solid var(--border-secondary, #1f1f2e); padding-top: 12px;
      color: var(--text-secondary); }
    .jc-setup-manual:empty { display: none; border-top: none; }
    .jc-setup-manual code { background: var(--bg-tertiary); padding: 1px 5px; border-radius: 3px;
      color: var(--text-primary); font-family: ui-monospace, monospace; }
    .jc-setup-manual b { color: var(--text-primary); }
    .jc-link { color: var(--accent-blue, #4fc3f7); cursor: pointer; text-decoration: underline; }
    .jc-link:hover { filter: brightness(1.15); }
    .jc-quiet { color: var(--text-tertiary, #666); font-size: 11px; margin: 0 0 10px !important; }
    /* The one diagnosis worth interrupting for: a device that is not there,
       which JS8Call reports as a format problem. */
    .jc-setup-note { font-size: 12px; line-height: 1.6; padding: 9px 11px; margin-bottom: 12px;
      border: 1px solid var(--border-primary); border-left: 3px solid var(--source-sota, #f0a500);
      border-radius: 4px; background: var(--bg-tertiary, #1a1a2e); color: var(--text-secondary); }
    .jc-setup-note[hidden] { display: none; }
    .jc-setup-note b { color: var(--text-primary); }
    .jc-setup-note code { background: var(--bg-hover); padding: 1px 5px; border-radius: 3px;
      color: var(--text-primary); font-family: ui-monospace, monospace; font-size: 11px;
      word-break: break-word; }
    /* The manual route, folded. Present for whoever needs it, silent for
       everyone the button above already serves. */
    .jc-fold-out summary { cursor: pointer; color: var(--text-secondary); font-size: 11.5px;
      list-style: none; display: inline-flex; align-items: center; gap: 5px; user-select: none; }
    .jc-fold-out summary::-webkit-details-marker { display: none; }
    .jc-fold-out summary::before { content: '\25B8'; font-size: 9px; transition: transform .12s ease; }
    .jc-fold-out[open] summary::before { transform: rotate(90deg); }
    .jc-fold-out summary:hover { color: var(--text-primary); }
    .jc-fold-out summary:focus-visible { outline: 2px solid var(--accent-blue, #4fc3f7); outline-offset: 2px; }
    .jc-fold-out > div { margin-top: 9px; }

    /* --- compose ----------------------------------------------------------- */
    .jc-compose { border-top: 1px solid var(--border-secondary, #1f1f2e); padding: 8px 12px;
      background: var(--bg-secondary); flex-shrink: 0; }
    .jc-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .jc-chip { font-size: 11px; padding: 2px 9px; border-radius: 12px; cursor: pointer;
      border: 1px solid var(--border-primary); color: var(--accent-blue, #4fc3f7);
      background: transparent; font-family: ui-monospace, monospace; }
    .jc-chip:hover { background: var(--bg-hover); }
    .jc-chip:disabled { opacity: .4; cursor: not-allowed; }
    .jc-row { display: flex; gap: 6px; align-items: center; }
    .jc-row input { flex: 1; min-width: 0; padding: 5px 8px; font-size: 12px;
      background: var(--bg-input, #0f1419); border: 1px solid var(--border-primary);
      color: var(--text-primary); border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .jc-btn { border: 1px solid var(--border-primary); background: var(--bg-input, #0f1419);
      color: var(--text-primary); border-radius: 4px; padding: 5px 12px; font-size: 12px;
      font-weight: 600; cursor: pointer; flex: none; }
    .jc-btn:hover { background: var(--bg-hover); }
    .jc-btn:disabled { opacity: .45; cursor: not-allowed; }
    .jc-btn.go { background: var(--accent-green-btn, #4ecca3); color: #000;
      border-color: var(--accent-green-btn, #4ecca3); }
    #jc-onair { margin-top: 6px; font-size: 10.5px; color: var(--text-secondary); line-height: 1.5;
      min-height: 15px; }
    #jc-onair.err { color: var(--accent-red, #e94560); }
    #jc-onair.ok { color: var(--accent-green-btn, #4ecca3); }
    #jc-onair code { font-family: ui-monospace, monospace; background: var(--bg-tertiary);
      border: 1px solid var(--border-secondary, #1f1f2e); border-radius: 3px; padding: 1px 5px;
      color: var(--text-primary); }

    /* --- heard rail -------------------------------------------------------- */
    .jc-stn { padding: 6px 10px; display: flex; align-items: baseline; gap: 6px; font-size: 11.5px;
      width: 100%; background: none; border: none; border-left: 2px solid transparent;
      text-align: left; color: inherit; font-family: inherit; cursor: pointer; }
    .jc-stn + .jc-stn { border-top: 1px solid var(--border-secondary, #1f1f2e); }
    .jc-stn:hover { background: var(--bg-hover); }
    .jc-stn:focus-visible { outline: 2px solid var(--accent-blue, #4fc3f7); outline-offset: -2px; }
    .jc-stn .c { font-weight: 600; font-family: ui-monospace, monospace; color: var(--text-primary); }
    .jc-stn .s { margin-left: auto; font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums;
      color: var(--text-secondary); font-size: 10.5px; }
    .jc-stn .a { font-size: 10px; color: var(--text-tertiary, #666); width: 28px; text-align: right; flex: none; }
  </style>
</head>
<body>
  <div class="jc-titlebar">
    <span>JS8Call</span>
    <div class="jc-controls">
      <button id="jc-min" title="Minimize">&minus;</button>
      <button id="jc-close" title="Close">&times;</button>
    </div>
  </div>

  <div class="jc-bar">
    <span class="jc-dot" id="jc-dot"></span>
    <span id="jc-state">Connecting&hellip;</span>
    <b class="mono" id="jc-station"></b>
    <span class="mono num" id="jc-dial"></span>
    <button class="jc-btn" id="jc-retry" style="padding:2px 8px;font-size:10px;" title="Re-read JS8Call's settings and reconnect">Retry</button>
    <span class="jc-tx" id="jc-tx">RX</span>
  </div>

  <div id="jc-problems"></div>

  <div class="jc-cols">
    <div class="jc-rail jc-rail-l">
      <div class="jc-railhead">Conversations <span id="jc-unread"></span></div>
      <div id="jc-convs"></div>
    </div>

    <div class="jc-thread">
      <div class="jc-threadhead" id="jc-threadhead" hidden></div>
      <!-- Shown INSTEAD of the transcript until the bridge is live. Deliberately
           a sibling of #jc-msgs, not a child: renderThread() clears #jc-msgs, so
           living inside it would delete this panel and orphan every cached
           reference to it the first time a conversation was opened.
           Setting JS8Call up by hand is six steps across three of its settings
           pages, so POTACAT offers to do it — but shows every change first,
           because this edits another application's configuration. -->
      <div class="jc-setup" id="jc-setup">
        <h2 id="jc-setup-title">Setting up JS8Call</h2>
        <p id="jc-setup-lede">Checking&hellip;</p>
        <div class="jc-setup-note" id="jc-setup-note" hidden></div>
        <p class="jc-quiet" id="jc-setup-slice-why" hidden></p>
        <ul id="jc-setup-changes"></ul>
        <div class="jc-setup-actions">
          <button class="jc-btn go" id="jc-setup-go" hidden>Set up and start JS8Call</button>
          <button class="jc-btn" id="jc-setup-launch" hidden>Start JS8Call</button>
          <button class="jc-btn go" id="jc-setup-dax" hidden>Start SmartSDR</button>
          <button class="jc-btn go" id="jc-setup-slice" hidden>Give JS8Call its own receiver</button>
          <label id="jc-setup-radio-wrap" hidden><input type="checkbox" id="jc-setup-radio"> <span id="jc-setup-radio-why">give it its own slice</span></label>
        </div>
        <!-- A div, not a p: it holds <p> and <details>, and a browser silently
             closes a <p> at the first block child, orphaning everything after. -->
        <div class="jc-setup-manual" id="jc-setup-manual"></div>
      </div>

      <div class="jc-msgs" id="jc-msgs"></div>

      <div class="jc-compose">
        <div class="jc-chips" id="jc-chips"></div>
        <div class="jc-row">
          <input type="text" id="jc-text" placeholder="Select a conversation, or type a full message" maxlength="200" autocomplete="off" spellcheck="false">
          <button class="jc-btn go" id="jc-send">Send</button>
        </div>
        <div id="jc-onair"></div>
      </div>
    </div>

    <div class="jc-rail jc-rail-r">
      <div class="jc-railhead">Heard now <button id="jc-refresh" title="Ask JS8Call again">refresh</button></div>
      <div id="jc-heard"></div>
    </div>
  </div>

  <script src="js8call-popout.js"></script>
</body>
</html>
